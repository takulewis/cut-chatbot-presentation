<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chatbot for CUT – Cinematic Presentation</title>
<style>
:root{--bg:#050B18;--blue:#1677FF;--cyan:#00E5FF;--vio:#8B5CF6;--tx:#F5F7FF;--tx2:#A6B3C7;--ln:rgba(0,229,255,.25);--f:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;--si:0}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%}
#cv{position:fixed;inset:-10%;width:120%;height:120%;transform:translateX(calc(var(--si)*-3%)) scale(calc(1 + var(--si)*.025));transition:transform 2.2s cubic-bezier(.65,0,.2,1);pointer-events:none}
#cv path{filter:drop-shadow(0 18px 30px rgba(0,0,0,.7)) drop-shadow(0 0 14px rgba(22,119,255,.25))}
#node{position:fixed;z-index:2;left:var(--nx,50%);top:var(--ny,50%);width:min(22vw,22vh);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--ns,1));opacity:var(--no,1);background:radial-gradient(circle at 35% 30%,#fff 0,var(--cyan) 12%,var(--blue) 45%,transparent 70%);filter:blur(1px) drop-shadow(0 0 40px var(--cyan));transition:left 1.8s cubic-bezier(.65,0,.2,1),top 1.8s cubic-bezier(.65,0,.2,1),transform 1.8s cubic-bezier(.65,0,.2,1),opacity 1.4s;animation:br 4s ease-in-out infinite}
@keyframes br{50%{filter:blur(2px) drop-shadow(0 0 70px var(--vio))}}
#stage{position:fixed;inset:0;z-index:3;perspective:1200px}
.s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4vh clamp(24px,8vw,140px) 14vh;opacity:0;visibility:hidden;transform:translateZ(-160px) scale(.96);filter:blur(10px);transition:opacity 1.1s,transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1.1s,visibility 1.4s}
.s.on{opacity:1;visibility:visible;transform:none;filter:none}
.s.x{transform:translateZ(220px) scale(1.06);filter:blur(12px)}
.nt,.nt *{transition:none!important}
.a{opacity:0;transform:translateY(26px) scale(.97);filter:blur(8px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.a.in{opacity:1;transform:none;filter:none}
.sp i{display:inline-block;font-style:normal;opacity:0;transform:translateY(.6em) rotateX(-70deg);filter:blur(10px);transition:1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k)*40ms)}
.sp.in i{opacity:1;transform:none;filter:none}.sp b{display:inline-block;white-space:nowrap;font-weight:inherit}
h1{font-size:clamp(2.4rem,6.4vw,6rem);line-height:1.02;letter-spacing:-.03em;font-weight:700;max-width:14ch}
h2{font-size:clamp(1.7rem,3.6vw,3.2rem);letter-spacing:-.02em;font-weight:650;margin-bottom:.4em;max-width:24ch;line-height:1.1}
.sub{color:var(--tx2);font-size:clamp(1rem,1.6vw,1.45rem);max-width:62ch;line-height:1.5}
.tag{color:var(--cyan);font-size:clamp(.85rem,1.2vw,1.05rem);margin-bottom:1rem}
.row{display:grid;gap:clamp(12px,1.6vw,24px);margin-top:clamp(16px,3vh,34px)}
.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c2{grid-template-columns:repeat(2,1fr)}.c6{grid-template-columns:repeat(6,1fr)}
.card{padding:clamp(14px,1.8vw,26px);border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--ln);backdrop-filter:blur(12px);box-shadow:0 20px 50px -25px #000}
.card h3{font-size:clamp(1rem,1.5vw,1.35rem);margin-bottom:.35em}
.card p{color:var(--tx2);font-size:clamp(.85rem,1.2vw,1.08rem);line-height:1.45}
.card.hl{border-color:var(--cyan);box-shadow:0 0 40px -8px rgba(0,229,255,.55)}
.n{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--vio));font-weight:700;font-size:.9rem;margin-bottom:.6rem}
.line{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--vio));transform-origin:left;transform:scaleX(var(--p,0));box-shadow:0 0 14px var(--cyan);margin-top:clamp(16px,3vh,30px)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,4vw,60px);align-items:center}
.lay{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.layer{display:flex;gap:16px;align-items:center;padding:14px 20px;border-radius:14px;border:1px solid var(--ln);background:rgba(10,20,40,.72);transition:border-color .6s,box-shadow .6s,background .6s}
.layer.hl{border-color:var(--cyan);box-shadow:0 0 36px -6px rgba(0,229,255,.6);background:rgba(0,229,255,.1)}
.layer b{min-width:9.5ch;color:var(--cyan);font-size:clamp(1rem,1.5vw,1.3rem)}.layer span{color:var(--tx2);font-size:clamp(.82rem,1.15vw,1.02rem)}
.pk{position:absolute;left:-14px;top:calc(var(--p,0)*100%);width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 20px var(--cyan);transform:translateY(-50%)}
.chat{border-radius:18px;border:1px solid var(--ln);background:#07101f;overflow:hidden;box-shadow:0 30px 80px -20px rgba(22,119,255,.55);max-width:560px}
.bar{display:flex;gap:6px;padding:10px 14px;background:#0d1a33}.bar i{width:10px;height:10px;border-radius:50%;background:var(--tx2);opacity:.5}
.bd{padding:18px;display:flex;flex-direction:column;gap:10px;min-height:140px;font-size:clamp(.85rem,1.2vw,1rem)}
.m{padding:10px 14px;border-radius:14px;max-width:88%;line-height:1.4}.u{align-self:flex-end;background:var(--blue)}.r{background:#13233f;color:var(--tx2)}
.cap{font-size:.78rem;color:var(--tx2);padding:8px 14px;border-top:1px solid var(--ln)}
.note{margin-top:20px;padding:14px 18px;border-left:3px solid var(--vio);background:rgba(139,92,246,.12);border-radius:8px;color:var(--tx2);max-width:70ch;font-size:clamp(.85rem,1.2vw,1.05rem);line-height:1.5}
.big{font-size:clamp(2.4rem,4.4vw,4rem);font-weight:700;color:var(--cyan);line-height:1;margin-bottom:.2em}
#hud{position:fixed;z-index:9;left:0;right:0;bottom:0;padding:10px clamp(14px,3vw,40px) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(5,11,24,.92));opacity:.45;transition:opacity .4s}
#hud:hover,#hud:focus-within,body.paused #hud{opacity:1}
#seg{display:flex;gap:3px;height:14px;align-items:center;cursor:pointer}
#seg div{height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;transition:height .2s}#seg div:hover{height:8px}
#seg div i{display:block;height:100%;width:calc(var(--f,0)*100%);background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--cyan)}
#hb{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.82rem;color:var(--tx2)}
#hb button{background:rgba(255,255,255,.07);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:5px 10px;cursor:pointer;font:500 .82rem var(--f)}
#hb button:hover,#hb button:focus-visible{border-color:var(--cyan);outline:none}
#hb .sp2{flex:1;text-align:center}
@media(max-width:900px){.c3,.c4,.c5,.c6,.two{grid-template-columns:1fr 1fr}.s{overflow:auto;justify-content:flex-start;padding-top:8vh}}
@media(max-width:560px){.c2,.c3,.c4,.c5,.c6,.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.a,.sp i{filter:none!important;transition-duration:.2s!important;transition-delay:0s!important}#node{animation:none}#cv,.s{transition-duration:.3s}}
</style></head><body>
<canvas id="bg"></canvas>
<svg id="cv" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B3A"/><stop offset="1" stop-color="#07112a"/></linearGradient><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#150F34"/><stop offset="1" stop-color="#0A1428"/></linearGradient></defs>
<path d="M-100 700C300 520 700 820 1150 560S1500 300 1700 380V1000H-100Z" fill="url(#g1)" opacity=".9"/><path d="M-100 320C250 120 650 420 1000 240S1450 60 1700 140V-100H-100Z" fill="url(#g2)" opacity=".9"/><path d="M-100 820C400 640 800 900 1250 700S1550 560 1700 600V1000H-100Z" fill="#0A1428" opacity=".7"/></svg>
<div id="node"></div><main id="stage"></main>
<div id="hud"><div id="seg"></div><div id="hb"><button id="bp" aria-label="Previous scene">&#9198;</button><button id="bq" aria-label="Pause or resume">Pause</button><button id="bn" aria-label="Next scene">&#9197;</button><button id="br" aria-label="Replay scene">Replay scene</button><button id="bs" aria-label="Restart">Restart</button><span class="sp2" id="inf"></span><span id="tm"></span><button id="bf" aria-label="Full screen">Full screen</button></div></div>
<script>
/* TIMING: edit durations here (seconds). Total target 210. */
const SC=[
{n:"Opening",d:18,nd:[50,42,1.15,1],h:`<div class="tag a" data-at="3">Chinhoyi University of Technology · BSc Honours in Information Technology</div><h1 class="sp" data-at="5">AI Chatbot for CUT</h1><p class="sub a" data-at="9" style="margin-top:1.2rem">An AI-powered chatbot system for Chinhoyi University of Technology, built to answer student enquiries from official CUT information.</p><p class="sub a" data-at="12" style="margin-top:1.4rem;font-size:clamp(.95rem,1.3vw,1.2rem)">Blessing Ketai &amp; Takudzwa Lewis Gondo · Supervisor: Dr Shangwa · May 2026</p>`},
{n:"The Problem",d:18,nd:[88,18,.45,.8],h:`<div class="tag a" data-at="1">Problem statement</div><h2 class="sp" data-at="1.5">Students need answers. The channels do not talk back.</h2><div class="row c3"><div class="card a" data-at="5"><span class="n">1</span><h3>Scattered answers</h3><p>Students search offices, phone calls, emails, WhatsApp and the portal.</p></div><div class="card a" data-at="8"><span class="n">2</span><h3>No conversation</h3><p>The portal handles registration and payments, but cannot answer plain-language questions.</p></div><div class="card a" data-at="11"><span class="n">3</span><h3>Repeated work</h3><p>Admissions and Registry staff answer the same routine enquiries again and again.</p></div></div><p class="sub a" data-at="14" style="margin-top:22px">Pre-development survey: 60 students and 5 Registry and Admissions staff.</p>`},
{n:"Aim and Objectives",d:20,nd:[10,82,.4,.8],h:`<div class="tag a" data-at="1">Aim and objectives</div><h2 class="sp" data-at="1.5">Develop an AI-powered chatbot that gives automated, context-aware answers to student enquiries.</h2><div class="row c5"><div class="card a" data-at="6"><span class="n">1</span><p>Analyse chatbot technologies used in higher education</p></div><div class="card a" data-at="8"><span class="n">2</span><p>Investigate common student information needs and FAQs</p></div><div class="card a" data-at="10"><span class="n">3</span><p>Design an LLM + RAG chatbot framework</p></div><div class="card a" data-at="12"><span class="n">4</span><p>Build a web prototype with Ollama and ChromaDB</p></div><div class="card a" data-at="14"><span class="n">5</span><p>Evaluate accuracy, response time and usability (SUS)</p></div></div>`},
{n:"Research Gap",d:16,nd:[90,80,.4,.7],h:`<div class="tag a" data-at="1">Literature review and research gap</div><h2 class="sp" data-at="1.5">Chatbots exist in education. Zimbabwean university administration is still open.</h2><div class="row c2"><div class="card a" data-at="4.5"><h3>What the literature shows</h3><p>Educational chatbots improve information access. Zimbabwean examples (UNESCO ROSA WhatsApp bot, FUNDISA SMS bot) deliver learning content to school learners.</p></div><div class="card hl a" data-at="7.5"><h3>The gap</h3><p>The sources reviewed found no empirically evaluated LLM + RAG chatbot for administrative enquiries at a Zimbabwean university.</p></div></div><div class="row c4"><div class="card a" data-at="10"><h3>Rule-based</h3><p>Breaks on unexpected phrasing.</p></div><div class="card a" data-at="10.8"><h3>Keyword / FAQ</h3><p>Fails on typos and new wording.</p></div><div class="card a" data-at="11.6"><h3>Intent-based NLP</h3><p>Needs training data and upkeep.</p></div><div class="card hl a" data-at="12.4"><h3>RAG (chosen)</h3><p>Documents update without retraining.</p></div></div>`},
{n:"Methodology",d:20,nd:[50,8,.3,.7],h:`<div class="tag a" data-at="1">Research methodology</div><h2 class="sp" data-at="1.5">Design Science Research, following Peffers et al. (2007)</h2><div class="line" data-p="4,9"></div><div class="row c6" style="margin-top:14px"><div class="card a" data-at="4"><span class="n">1</span><p>Identify the problem</p></div><div class="card a" data-at="5.5"><span class="n">2</span><p>Define the goals</p></div><div class="card a" data-at="7"><span class="n">3</span><p>Design and build</p></div><div class="card a" data-at="8.5"><span class="n">4</span><p>Show it works</p></div><div class="card a" data-at="10"><span class="n">5</span><p>Evaluate</p></div><div class="card a" data-at="11.5"><span class="n">6</span><p>Report results</p></div></div><p class="sub a" data-at="13" style="margin-top:20px">Mixed methods: questionnaires and a review of CUT documents. Testing at unit, integration and informal user levels.</p><div class="note a" data-at="15.5">Yamane’s formula gave about 99 students; 60 responded because of time and resource limits (Section 3.3.2).</div>`},
{n:"How It Works",d:24,nd:[92,50,.35,.7],h:`<div class="tag a" data-at="1">Processing workflow</div><h2 class="sp" data-at="1.5">Ask, retrieve, generate, verify</h2><div class="line" data-p="4,16"></div><div class="row c4" style="margin-top:14px"><div class="card a" data-hl="4,24" data-at="4"><span class="n">1</span><h3>Ask</h3><p>A question in natural English, even with spelling mistakes.</p></div><div class="card a" data-hl="9,24" data-at="9"><span class="n">2</span><h3>Retrieve</h3><p>ChromaDB finds the best passages from official CUT documents.</p></div><div class="card a" data-hl="14,24" data-at="14"><span class="n">3</span><h3>Generate</h3><p>A local LLM (Llama 3.2 / Phi) answers using only those passages.</p></div><div class="card a" data-hl="19,24" data-at="19"><span class="n">4</span><h3>Verify</h3><p>Numbers, emails and names are checked. If unsupported, official text is shown.</p></div></div><p class="sub a" data-at="21" style="margin-top:20px">Before retrieval: spelling correction and query expansion. Retrieval is hybrid (semantic and keyword), then reranked.</p>`},
{n:"Architecture",d:28,nd:[6,50,.35,.7],h:`<div class="tag a" data-at="1">System architecture · four layers</div><div class="two"><div><h2 class="sp" data-at="1.5">Four layers, each replaceable on its own</h2><div class="lay"><div class="pk a" data-at="5" data-p="5,21,tri"></div><div class="layer a" data-at="4" data-hl="5,11"><b>Presentation</b><span>React.js web chat; answers stream in as written</span></div><div class="layer a" data-at="6.5" data-hl="9,20"><b>Application</b><span>Python backend: REST API and RAG engine (search, rerank, verify)</span></div><div class="layer a" data-at="9" data-hl="13,18"><b>Intelligence</b><span>Ollama: Llama 3.2, Phi and nomic-embed-text, all local</span></div><div class="layer a" data-at="11.5" data-hl="11,16"><b>Data</b><span>ChromaDB vectors, official CUT documents, conversation database</span></div></div></div><div class="card a" data-at="15"><h3>Path of one question</h3><p>Interface to API, normalise and expand, embed, search ChromaDB, build prompt, draft answer from the language model, verify, save the conversation, return the answer to the student.</p><p style="margin-top:12px">Tools: Python · Ollama · ChromaDB · React.js · Git. An optional Gemini provider exists for benchmark comparison only.</p></div></div>`},
{n:"Trustworthy by Design",d:16,nd:[50,92,.3,.6],h:`<div class="tag a" data-at="1">Design safeguards</div><h2 class="sp" data-at="1.5">Every draft answer is checked before a student sees it</h2><div class="row c4"><div class="card a" data-at="4"><h3>Private by design</h3><p>Models run locally. No student records or personal data collected.</p></div><div class="card a" data-at="6"><h3>Grounded answers</h3><p>Answers come only from official CUT documents.</p></div><div class="card a" data-at="8"><h3>Always answers</h3><p>If the model is slow, matching official text is shown.</p></div><div class="card a" data-at="10"><h3>Easy to update</h3><p>The administrator uploads documents. No retraining.</p></div></div><p class="sub a" data-at="12.5" style="margin-top:20px">Checks: empty answers, model self-references, numbers, email and web addresses, unknown names, unsupported claims.</p>`},
{n:"Live Demo",d:22,nd:[8,50,.3,.6],h:`<div class="tag a" data-at="1">System demonstration</div><div class="two"><div><h2 class="sp" data-at="1.5">Live demo</h2><div class="lay" style="gap:8px"><div class="layer a" data-at="3" data-hl="4,8"><b>1</b><span>Admission requirements</span></div><div class="layer a" data-at="3.4" data-hl="8,11"><b>2</b><span>Tuition fees for a programme</span></div><div class="layer a" data-at="3.8" data-hl="11,14"><b>3</b><span>Bank payment details</span></div><div class="layer a" data-at="4.2" data-hl="14,17"><b>4</b><span>A question with spelling mistakes</span></div><div class="layer a" data-at="4.6" data-hl="17,22"><b>5</b><span>A follow-up question</span></div></div></div><div class="chat a" data-at="4"><div class="bar"><i></i><i></i><i></i></div><div class="bd"><div class="m u a" data-at="5" data-ty="5.5,What are the admission requirements?"></div><div class="m r a" data-at="8" data-ty="8.5,Here is what the official CUT records say…"></div></div><div class="cap">Illustrative mock-up. The working system is shown live; screenshots or a screen recording replace this panel.</div></div></div>`},
{n:"Evaluation",d:14,nd:[50,10,.3,.6],h:`<div class="tag a" data-at="1">Testing and evaluation</div><h2 class="sp" data-at="1.5">Targets set before testing</h2><div class="row c3"><div class="card a" data-at="4"><div class="big">80%+</div><p>Accuracy on 50 standard questions across five categories, marked against CUT source documents</p></div><div class="card a" data-at="6"><div class="big">15–20 s</div><p>Response time on local CPU hardware, comparing Llama 3.2 and Phi</p></div><div class="card a" data-at="8"><div class="big">70+</div><p>System Usability Scale score from 60 student respondents</p></div></div><div class="note a" data-at="10.5">Measured results are in Chapter 5, which was not supplied. Add them before the defence.</div>`},
{n:"Conclusion",d:14,nd:[50,40,1,1],h:`<h1 class="sp" data-at="1.5">Thank you</h1><p class="sub a" data-at="5" style="margin-top:1rem">An AI chatbot that answers from official CUT documents, runs locally and verifies every answer.</p><p class="sub a" data-at="8" style="margin-top:1.2rem;font-size:1.1rem">Blessing Ketai · Takudzwa Lewis Gondo · Supervisor: Dr Shangwa</p><p class="tag a" data-at="10.5" style="margin-top:1.4rem">Questions and discussion</p>`}
];
const T=SC.reduce((a,s)=>a+s.d,0);SC.forEach((s,i)=>{s.st=i?SC[i-1].st+SC[i-1].d:0});
const $=id=>document.getElementById(id),stg=$("stage"),seg=$("seg"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let t=0,play=true,cur=-1,prev=-1,last=performance.now(),els=[];
SC.forEach((s,i)=>{const d=document.createElement("section");d.className="s";d.innerHTML=s.h;
d.querySelectorAll(".sp").forEach(e=>{let k=0;e.setAttribute("aria-label",e.textContent);e.innerHTML=e.textContent.split(" ").map(w=>"<b>"+[...w].map(c=>`<i aria-hidden="true" style="--k:${k++}">${c}</i>`).join("")+"</b> ").join("")});
stg.append(d);const q=document.createElement("div");q.style.flex=s.d;q.title=s.n;q.innerHTML="<i></i>";q.onclick=e=>{const r=q.getBoundingClientRect();seek(s.st+(e.clientX-r.left)/r.width*s.d)};seg.append(q);
els[i]={sec:d,at:[...d.querySelectorAll("[data-at]")].map(e=>[e,+e.dataset.at]),p:[...d.querySelectorAll("[data-p]")].map(e=>[e,...e.dataset.p.split(",")]),hl:[...d.querySelectorAll("[data-hl]")].map(e=>[e,...e.dataset.hl.split(",").map(Number)]),ty:[...d.querySelectorAll("[data-ty]")].map(e=>{const j=e.dataset.ty.indexOf(",");return[e,+e.dataset.ty.slice(0,j),e.dataset.ty.slice(j+1)]})}});
function fmt(x){x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function enter(i){const e=els[i];e.sec.classList.add("nt");e.at.forEach(a=>a[0].classList.remove("in"));requestAnimationFrame(()=>requestAnimationFrame(()=>e.sec.classList.remove("nt")))}
function scene(i){if(i==cur)return;els.forEach((e,j)=>{if(j!=i&&j!=cur){e.sec.classList.remove("on","x");if(j!=i)e.at.forEach(a=>a[0].classList.remove("in"))}});
if(cur>=0){els[cur].sec.classList.remove("on");els[cur].sec.classList.add("x")}
prev=cur;cur=i;enter(i);els[i].sec.classList.remove("x");els[i].sec.classList.add("on");
const n=SC[i].nd;const s=document.documentElement.style;s.setProperty("--nx",n[0]+"%");s.setProperty("--ny",n[1]+"%");s.setProperty("--ns",n[2]);s.setProperty("--no",n[3]);s.setProperty("--si",i);
history.replaceState(null,"","#"+(i+1))}
function render(){let i=SC.findIndex(s=>t<s.st+s.d);if(i<0)i=SC.length-1;scene(i);const st=t-SC[i].st,e=els[i];
e.at.forEach(([el,a])=>el.classList.toggle("in",st>=a));
e.p.forEach(([el,a,d,m])=>{let p=Math.min(1,Math.max(0,(st-a)/d));if(m=="tri")p=p<.5?p*2:2-p*2;el.style.setProperty("--p",p)});
e.hl.forEach(([el,a,b])=>el.classList.toggle("hl",st>=a&&st<b));
e.ty.forEach(([el,a,tx])=>{el.textContent=tx.slice(0,Math.max(0,Math.floor((st-a)*32)))});
[...seg.children].forEach((q,j)=>q.style.setProperty("--f",Math.min(1,Math.max(0,(t-SC[j].st)/SC[j].d))));
$("inf").textContent=(i+1)+"/"+SC.length+"  "+SC[i].n+" · scene "+fmt(st)+" / "+fmt(SC[i].d);$("tm").textContent=fmt(T-t)+" left"}
function seek(x){t=Math.min(T-.01,Math.max(0,x));render()}
function jump(d){const i=cur+d;if(i>=0&&i<SC.length)seek(SC[i].st+.01)}
function setPlay(v){play=v;$("bq").textContent=v?"Pause":"Play";document.body.classList.toggle("paused",!v)}
$("bq").onclick=()=>{if(t>=T-.05)seek(0);setPlay(!play)};$("bp").onclick=()=>{t-SC[cur].st>3?seek(SC[cur].st+.01):jump(-1)};$("bn").onclick=()=>jump(1);
$("br").onclick=()=>{cur=-1;seek(SC[Math.max(0,SC.findIndex(s=>t<s.st+s.d))].st+.01);setPlay(true)};$("bs").onclick=()=>{cur=-1;seek(0);setPlay(true)};
$("bf").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener("keydown",e=>{const k=e.key;if(k==" "||k=="k"){e.preventDefault();$("bq").click()}else if(k=="ArrowRight"||k=="PageDown")jump(1);else if(k=="ArrowLeft"||k=="PageUp")$("bp").click();else if(k=="r"||k=="R")$("br").click();else if(k=="Home")$("bs").click();else if(k=="f"||k=="F")$("bf").click()});
document.addEventListener("visibilitychange",()=>{last=performance.now()});
function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;if(play){t+=dt;if(t>=T){t=T-.01;setPlay(false)}}render();requestAnimationFrame(loop)}
const h=parseInt(location.hash.slice(1));if(h>0&&h<=SC.length)t=SC[h-1].st+.01;
/* particles + parallax network */
const cv=$("bg"),x=cv.getContext("2d");let W,H,P=[],ox=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(80,Math.floor(W*H/18000))},()=>({x:Math.random()*W,y:Math.random()*H,z:.3+Math.random()*.9,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}))}
function fr(){x.clearRect(0,0,W,H);const tx=(cur<0?0:cur)*-40;ox+=(tx-ox)*.02;
for(const p of P){if(!rm){p.x+=p.vx*p.z;p.y+=p.vy*p.z}if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<0||p.y>H)p.vy*=-1;p.dx=((p.x+ox*p.z)%W+W)%W}
for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.dx-b.dx,a.y-b.y);if(d<150){x.strokeStyle="rgba(0,229,255,"+.2*(1-d/150)*Math.min(a.z,b.z)+")";x.beginPath();x.moveTo(a.dx,a.y);x.lineTo(b.dx,b.y);x.stroke()}}
x.fillStyle="rgba(22,119,255,"+(.4+a.z*.4)+")";x.beginPath();x.arc(a.dx,a.y,1+a.z*1.6,0,7);x.fill()}
requestAnimationFrame(fr)}
addEventListener("resize",rs);rs();fr();requestAnimationFrame(n=>{last=n;loop(n)});
</script></body></html>
